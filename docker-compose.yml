# ABOUTME: Three-container deployment — a sync worker that owns the vault, the MCP server that
# reads it, and a Cloudflare Tunnel that is the only way in from outside.
#
# The shape that matters: nothing publishes a host port. cloudflared reaches the MCP server over
# the internal compose network, so there is no listening socket on the NAS for anyone on the LAN
# to find, and no firewall rule to get wrong. Every request arrives through the tunnel.
#
# Secrets come from a .env file beside this one (see .env.example). Nothing secret belongs in
# here — this file is committed. The `:?` suffixes make compose refuse to start with a clear
# message rather than booting a half-configured server.

services:
  # The only writer. Mirrors the vault down from Obsidian Sync and keeps it current.
  #
  # Belphemur/obsidian-headless-sync-docker, which wraps `ob` — Obsidian's official headless
  # client. Chosen over a hand-rolled image because obsidian-headless is an open beta at 0.0.x
  # whose CLI surface moves between patch releases, and this project tracks it release-for-
  # release. A sync client that quietly stops working is a likelier failure here than a
  # container escape.
  #
  # One-time setup, before `up`:
  #   docker compose run --rm --entrypoint get-token obsidian-sync
  # then put the printed value in .env as OBSIDIAN_AUTH_TOKEN. Everything else is declarative —
  # the container runs sync-setup itself from VAULT_NAME on first start.
  obsidian-sync:
    # Pinned. :latest on the one container holding Obsidian account credentials and owning the
    # vault is the wrong place to accept a moving tag.
    image: ghcr.io/belphemur/obsidian-headless-sync-docker:${SYNC_IMAGE_TAG:-0.0.14}
    container_name: obsidian-sync
    restart: unless-stopped

    environment:
      OBSIDIAN_AUTH_TOKEN: "${OBSIDIAN_AUTH_TOKEN:?mint one — docker compose run --rm --entrypoint get-token obsidian-sync}"
      VAULT_NAME: "${VAULT_NAME:?set VAULT_NAME in .env to your remote vault name}"
      # Required if the vault uses end-to-end encryption.
      VAULT_PASSWORD: ${VAULT_PASSWORD:-}

      # The most important line in this file. `ob sync-config --mode` takes exactly three values:
      # bidirectional, pull-only, mirror-remote. mirror-remote is download-only and actively
      # REVERTS local changes — new local files are deleted, modified ones re-downloaded over —
      # so the sidecar cannot push a change to every device you own.
      #
      # Blanking this does NOT restore bidirectional, despite what an earlier version of this
      # comment claimed. The image runs `ob sync-config` only `if [ -n "$SYNC_MODE" ]`, and the
      # mode is persisted in the obsidian-config volume, so an empty value leaves whatever was
      # last applied in force — forever. To change it, set it literally.
      #
      # Setting bidirectional is what makes MCP writes durable, and it is whole-vault: there is
      # no per-folder mode, so the subpath mount below stops scoping what can be PUSHED. Only
      # the MCP server stays confined to one folder.
      #
      # Caveat worth knowing: the image applies this best-effort (`|| true` with stderr
      # discarded), so a failure here is silent. After first start, confirm it actually took:
      #   docker compose exec obsidian-sync ob sync-status --path /vault
      SYNC_MODE: ${SYNC_MODE:-mirror-remote}

      # What happens when the same note changed in two places. The image's default is `merge`:
      # Google's diff-match-patch, applied to any .md file. An Excalidraw drawing IS a .md file
      # whose payload is a chunked LZString base64 blob, so a character-level merge of two
      # versions produces a scene that is wrong — and the dangerous case is not the one that
      # fails to decode (that surfaces an error) but the one that still decodes into valid JSON,
      # where nothing warns anybody. `conflict` writes a "(Conflicted copy ...)" file instead,
      # which is recoverable. Obsidian Sync's own default has the same flaw: it excludes
      # .canvas from text merge but not Excalidraw .md.
      CONFLICT_STRATEGY: ${CONFLICT_STRATEGY:-conflict}

      # Folders never downloaded at all. With the MCP server scoped to one folder by subpath
      # mount (below), this is no longer what keeps notes away from the agent — it keeps them
      # off this machine's disk entirely, which is a different and still worthwhile guarantee.
      # Worth setting for anything you would not want present on the NAS at all.
      EXCLUDED_FOLDERS: ${EXCLUDED_FOLDERS:-}

      # File ownership inside the shared volume. The MCP server runs as uid 1000 and only reads,
      # so matching keeps the mount readable without widening permissions.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      VAULT_PATH: /vault
      DEVICE_NAME: ${DEVICE_NAME:-obsidian-mcp-host}

    volumes:
      - vault-data:/vault
      # Login state. Not strictly required once OBSIDIAN_AUTH_TOKEN is set, but it keeps sync
      # bookkeeping across container replacement.
      - obsidian-config:/home/obsidian/.config

    # This image is built on s6-overlay, which supervises as root and drops privileges per
    # service. That buys PUID/PGID and proper supervision, and it rules out the stricter
    # options: `cap_drop: ALL` fails its init chown of /vault, `read_only` fails because s6
    # needs a writable executable /run, and `user: 1000` combined with no-new-privileges fails
    # outright ("unable to fix /run"). no-new-privileges alone is the practical maximum.
    #
    # Accepted deliberately: this container has no inbound exposure, and capability drops would
    # not defend against its realistic risk anyway — a bad obsidian-headless release already has
    # legitimate vault and network access.
    security_opt:
      - no-new-privileges:true

  obsidian-mcp:
    # Pin to an immutable tag in production. `:deploy` moves, so a `docker compose pull` could
    # swap the running code without any version changing. The sha tag, or the digest, cannot.
    image: ${MCP_IMAGE:-ghcr.io/brandonm/obsidian-remote-mcp:sha-93e4851}
    container_name: obsidian-mcp
    restart: unless-stopped
    depends_on:
      - obsidian-sync

    environment:
      VAULT_PATH: /vault

      # Belt and braces with the `:ro` mount below. The mount stops the kernel from allowing a
      # write; this stops the server from trying, so a blocked write returns a clean "vault is in
      # read-only mode" to the agent instead of an EROFS surfacing as an unexplained failure.
      #
      # This one variable drives BOTH layers: it is interpolated into the mount's `read_only`
      # below as well, because the two must never disagree. App-writable over a read-only mount
      # turns every write into a bare EROFS; mount-writable under an app that refuses is merely
      # confusing. Flipping one and forgetting the other was the likeliest way to misconfigure
      # this, so it is no longer possible from .env.
      #
      # Enabling writes is therefore TWO settings, not one:
      #   1. VAULT_READ_ONLY=false (compared with === 'true', so any other value allows writes)
      #   2. SYNC_MODE=bidirectional above — without it the sidecar reverts each write in seconds
      # Do 1 without 2 and writes succeed, report success, and then vanish. That is strictly
      # worse than the clean refusal you get by leaving this alone.
      VAULT_READ_ONLY: ${VAULT_READ_ONLY:-true}

      # No tool-call log at all. Worth knowing exactly what this turns off: not just note bodies
      # (those are redacted anyway) but search queries, note paths, titles and tags — which for a
      # personal vault are often as revealing as the bodies. Also disables vault_feedback.
      LOG_ENABLED: "false"

      # --- Required. The server refuses to start without these. ---
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:?set MCP_CLIENT_ID in .env}
      # The approval page must be guarded or createAuth throws at construction and the process
      # exits before it listens. This password is the entire gate — make it long and random.
      APPROVAL_PASSWORD: ${APPROVAL_PASSWORD:?set APPROVAL_PASSWORD in .env}
      # The tunnel's public hostname, scheme + host, no /mcp path. Must match what clients see.
      MCP_BASE_URL: ${MCP_BASE_URL:?set MCP_BASE_URL in .env, e.g. https://mcp.example.com}

      # --- Recommended hardening. ---
      # Replaces the built-in default, which also trusts ChatGPT, Cursor and Poke callbacks.
      MCP_CLIENT_ALLOWED_REDIRECT_URIS: ${MCP_CLIENT_ALLOWED_REDIRECT_URIS:-https://claude.ai/api/mcp/auth_callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://claude.ai}
      # Survives container replacement; without it every redeploy forces users to re-authorize.
      TOKEN_STORE_PATH: /app/data/tokens.json

    volumes:
      # Scoped to ONE folder of the vault, and read-only unless VAULT_READ_ONLY says otherwise
      # (same variable as the env above — see the note there for why they are not separate).
      #
      # `subpath` is what makes this an allowlist rather than a denylist. The container's /vault
      # IS the AI folder — the rest of the vault is not in its mount namespace at all, so
      # `/vault/..` is the container root, not your notes. Nothing in the application layer is
      # being trusted to hide anything: Job Hunt, Ledger and the rest are absent, not filtered.
      #
      # This is strictly stronger than .mcpignore, which can only hide files that are present,
      # and it is why the path-traversal fixes are a second line of defence here rather than
      # the only one.
      #
      # Fail-closed by design: if the folder has not synced yet, the container refuses to start
      # with "cannot access path ... no such file or directory" rather than coming up scoped to
      # something unintended. Start obsidian-sync first and let the folder land.
      - type: volume
        source: vault-data
        target: /vault
        read_only: ${VAULT_READ_ONLY:-true}
        volume:
          subpath: ${AI_FOLDER:-AI}
      - mcp-tokens:/app/data

    # No `ports:` on purpose. cloudflared reaches this over the compose network at
    # http://obsidian-mcp:3456, so the server is unreachable from the LAN and from the host.
    # A published port would reintroduce a path that bypasses the tunnel — and with it any
    # Cloudflare Access policy in front. Uncomment only for local debugging, never in production:
    #   ports:
    #     - "127.0.0.1:3456:3456"

    # The container needs to write exactly one thing: the token store, which has its own volume.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The only ingress. A remote-managed tunnel: create it in the Cloudflare Zero Trust dashboard
  # (Networks → Tunnels), copy the token into .env, then add a public hostname routing to
  # http://obsidian-mcp:3456 — the compose service name, not localhost, since cloudflared runs
  # in its own container.
  #
  # Because the MCP server has no host port, a Cloudflare Access policy on /authorize is a real
  # gate rather than a suggestion: there is no other route to it. That is what makes
  # APPROVAL_OPEN=true defensible here — though keeping APPROVAL_PASSWORD set as well costs
  # nothing and means the app still guards itself if the tunnel config is ever changed.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      obsidian-mcp:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env from the Cloudflare Zero Trust dashboard}
    # Outbound-only: the tunnel dials Cloudflare, so nothing needs to listen and no inbound
    # firewall rule is required.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vault-data:
  mcp-tokens:
  obsidian-config:
